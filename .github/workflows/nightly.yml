name: Nightly SideStore Build

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      # `scripts/ci/workflow.py upload-release` calls `gh release create/edit` on the
      # nightly release. Without explicit contents:write the GITHUB_TOKEN is read-only
      # and that step dies with "HTTP 403: Resource not accessible by integration".
      contents: write
    env:
      DEPLOY_KEY: ${{ secrets.CROSS_REPO_PUSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Nightly
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find Last Successful commit
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit \
            "false" "${{ env.CHANNEL }}" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a $GITHUB_ENV

      - name: Check for new changes (on schedule)
        id: check_changes
        if: github.event_name == 'schedule'
        run: |
          NEW_COMMITS=$(python3 scripts/ci/workflow.py count-new-commits "$LAST_SUCCESSFUL_COMMIT")
          SHOULD_BUILD=$([ "${NEW_COMMITS:-0}" -ge 1 ] && echo true || echo false)
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "NEW_COMMITS=$NEW_COMMITS" | tee -a $GITHUB_ENV

      - name: Should Skip Building (on schedule)
        id: build_gate
        run: |
          SHOULD_SKIP=$(
            { [ "${{ github.event_name }}" = "schedule" ] && \
              [ "${{ steps.check_changes.outputs.should_build }}" != "true" ]; \
            } && echo true || echo false
          )
          echo "should_skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT

      - run: brew install ldid xcbeautify
        if: steps.build_gate.outputs.should_skip != 'true'

      # --------------------------------------------------
      # runtime env setup
      # --------------------------------------------------
      - name: Setup Env
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
              "$MARKETING_VERSION" \
              "$BUILD_NUM" \
              "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        if: steps.build_gate.outputs.should_skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore Cache (exact)
        if: steps.build_gate.outputs.should_skip != 'true'
        id: xcode-cache-exact
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-${{ github.sha }}

      - name: Restore Cache (last)
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          steps.xcode-cache-exact.outputs.cache-hit != 'true'
        id: xcode-cache-fallback
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-

      # --------------------------------------------------
      # build and test
      # --------------------------------------------------
      - name: Clean
        if: steps.build_gate.outputs.should_skip != 'true' && contains(github.event.head_commit.message, '[--clean-build]')
        run: |
          python3 scripts/ci/workflow.py clean
          python3 scripts/ci/workflow.py clean-derived-data
          python3 scripts/ci/workflow.py clean-spm-cache

      - name: Boot simulator (async)
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        run: |
          mkdir -p build/logs
          python3 scripts/ci/workflow.py boot-sim-async "iPhone 17 Pro"

      - name: Build
        if: steps.build_gate.outputs.should_skip != 'true'
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          # --- Break SwiftPM binaryTarget concurrent-download race (FB10471859) ---
          # SwiftPM binaryTarget download race (Apple FB10471859): several packages
          # resolve binaryTargets concurrently and collide on the same mangled
          # global-cache path -> "already exists in file system" /
          # "doesn't exist in file system" -> fatalError, which aborts the WHOLE
          # resolve and leaves every artifact missing.
          #
          # Fix: clear stale half-fetched artifacts, then pre-seed EVERY binaryTarget
          # zip into the exact global-cache path SwiftPM looks up, so SwiftPM's
          # fetch() sees a cache hit for all of them and performs zero downloads.
          # (Seeding only OpenSSL is not enough - the race just moves to the rest.)
          #
          # Cache key = url.absoluteString.spm_mangledToC99ExtendedIdentifier(),
          # i.e. every non-alphanumeric character becomes "_".
          SPM_ARTIFACTS="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$SPM_ARTIFACTS"
          # NOTE: must delete the WHOLE SourcePackages dir, not just its `artifacts`
          # subdir. The CI cache restores DerivedData together with
          # SourcePackages/workspace-state.json; removing only `artifacts` leaves
          # SwiftPM believing the artifacts are already fetched, so it skips
          # extraction entirely and every target then fails with
          # "There is no XCFramework found at .../SourcePackages/artifacts/...".
          find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name SourcePackages -prune -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "$SPM_ARTIFACTS"

          seed_artifact() {
            url="$1"; sha="$2"
            key="$(printf '%s' "$url" | sed 's/[^a-zA-Z0-9]/_/g')"
            dest="$SPM_ARTIFACTS/$key"
            echo "==> seeding $key"
            curl -fL --retry 5 --retry-delay 3 -o "$dest" "$url"
            echo "$sha  $dest" | shasum -a 256 -c - || { echo "checksum mismatch: $url" >&2; exit 1; }
          }

          # remotepairingkit / codesignkit / gsacryptokit -> OpenSSL
          seed_artifact "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" \
                        "37846a8bd302cb2443eff47f1045ab844d0cd40bf82cc6159cfad9aa5c3eff9e"
          # anisettekit -> Unicorn
          seed_artifact "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip" \
                        "4f61907db6aafc56fb3e336b524d742342312f498bb40739f1da55fb4a24614a"
          # minimuxer -> EMProxy
          seed_artifact "https://github.com/SideStore/em_proxy/releases/download/v0.9.3/EMProxy.xcframework.zip" \
                        "3998789c38d09b55e488d46e31897affc7bbcb9c244d7a9d5b2d5cf6afd916c3"
          # devicegateway -> IDevice
          seed_artifact "https://github.com/SideStore/idevice/releases/download/v0.1.66-ss-61c2704/idevice-xcframework-v0.1.66-ss-61c2704.zip" \
                        "6f32b32ca43d3f28c145742da926cc279d312abd99abe55c79f875e2d6d5e162"
          # devicegateway -> libimobiledevice
          seed_artifact "https://github.com/SideStore/libimobiledevice-xcframework/releases/download/1.4.0-ss-0f88f7b/libimobiledevice.xcframework.zip" \
                        "7ccbdd56b074807461fc43d2e32ba92f20df2501a6c14cf9f64a917e7f3fe6e7"

          ls -la "$SPM_ARTIFACTS"
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          echo "encrypted=true" >> $GITHUB_OUTPUT
          exit $STATUS

      - name: Verify App Intents / SiriKit wiring
        run: |
          # Fails the build if an App Intent claims to migrate the legacy SiriKit
          # `RefreshAllIntent`: that shadows the working SiriKit action and makes
          # "Refresh All Apps" report "not supported on iPhone" on iOS 17.0/17.1.
          python3 scripts/ci/check_appintents.py SideStore.ipa

      - name: Debug - dump raw build log on failure
        if: failure()
        run: |
          echo "===== [DEBUG] raw xcodebuild error lines ====="
          grep -n -iE "error:|failed|unable|cannot|invalid|checksum|no such|not found|downloading|fatal" build/logs/build.log 2>/dev/null | tail -120 || true
          echo "===== [DEBUG] raw tail ====="
          tail -60 build/logs/build.log 2>/dev/null || true

      - name: Tests Build
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        id: test-build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py tests-build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-tests-build
          exit $STATUS

      - name: Save Cache
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          steps.xcode-cache-fallback.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-${{ github.ref_name }}-${{ github.sha }}

      - name: Tests Run
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        id: test-run
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py tests-run "iPhone 17 Pro"; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-tests-run
          exit $STATUS

      # --------------------------------------------------
      # artifacts
      # --------------------------------------------------
      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        with:
          name: tests-build-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        with:
          name: tests-run-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-run-logs.zip

      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa
      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: SideStore.dSYMs.zip

      - uses: actions/checkout@v4
        if: steps.build_gate.outputs.should_skip != 'true' && env.DEPLOY_KEY != ''
        with:
          repository: "SideStore/apps-v2.json"
          ref: "main"
          token: ${{ secrets.CROSS_REPO_PUSH_KEY }}
          path: "SideStore/apps-v2.json"

      - name: Generate Metadata
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py dump-project-settings
          PRODUCT_NAME=$(python3 scripts/ci/workflow.py read-product-name)
          BUNDLE_ID=$(python3 scripts/ci/workflow.py read-bundle-id)
          IPA_NAME="$PRODUCT_NAME.ipa"

          python3 scripts/ci/workflow.py generate-metadata \
            "$CHANNEL" \
            "$SHORT_COMMIT" \
            "$MARKETING_VERSION" \
            "$CHANNEL" \
            "$BUNDLE_ID" \
            "$IPA_NAME" \
            "$LAST_SUCCESSFUL_COMMIT"

      - name: Deploy
        if: steps.build_gate.outputs.should_skip != 'true' && env.DEPLOY_KEY != ''
        run: |
          SOURCE_JSON="_includes/source.json"

          python3 scripts/ci/workflow.py deploy \
            SideStore/apps-v2.json \
            "$SOURCE_JSON" \
            "$CHANNEL" \
            "$MARKETING_VERSION"
      

      # --------------------------------------------------
      # upload release to GH
      # --------------------------------------------------
      - name: Upload Release
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py upload-release \
            "$RELEASE_NAME" \
            "$CHANNEL" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$UPSTREAM_CHANNEL"
