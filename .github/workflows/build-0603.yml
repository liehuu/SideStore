name: Build SideStore 0.6.3 (custom bundle ID)

# Builds the 0.6.3 source (commit d2c0b5f6) with the "custom AltStore bundle ID"
# feature added, and uploads SideStore.ipa + dSYMs as workflow artifacts.
#
# Why 0.6.3: it bundles OpenSSL as a LOCAL xcframework via the AltSign submodule
# (Dependencies/AltSign/Dependencies/OpenSSL.xcframework), so there is NO SwiftPM
# binary-target download of OpenSSL — the blocker that failed the nightly 0.6.4
# builds does not apply here.
#
# Trigger: push to develop-0.6.3, or manual workflow_dispatch.

on:
  push:
    branches: [develop-0.6.3]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid

      # --------------------------------------------------
      # runtime env setup
      # --------------------------------------------------
      - name: Setup Env
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commid-id)

          QUALIFIED_VERSION=$(python3 scripts/ci/workflow.py compute-qualified \
              "$MARKETING_VERSION" \
              "$BUILD_NUM" \
              "${{ env.CHANNEL }}" \
              "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$QUALIFIED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$QUALIFIED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      # Authenticate GitHub fetches so SPM package downloads (Roxas, etc.) are not
      # rate-limited. OpenSSL itself is local (submodule), so no large binary download.
      - name: Authenticate GitHub Package Fetches
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"

      # Always start from a pristine DerivedData + SPM cache. This guarantees no
      # half-downloaded / stale artifact can cause an "already exists in file system"
      # fatal error during package resolution.
      - name: Clean DerivedData & SPM cache
        run: |
          python3 scripts/ci/workflow.py clean-derived-data
          python3 scripts/ci/workflow.py clean-spm-cache

      - name: Build
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build || true
          echo "encrypted=true" >> $GITHUB_OUTPUT
          exit $STATUS

      # --------------------------------------------------
      # publish SideStore.ipa to the "nightly" release so the
      # LiveContainer fork's build_github.sh can fetch it from
      # https://github.com/liehuu/SideStore/releases/download/nightly/SideStore.ipa
      # --------------------------------------------------
      - name: Publish to nightly release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          files: SideStore.ipa
          body: |
            Custom SideStore 0.6.3 (AltStore prefix bundle ID)
            Commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # artifacts
      # --------------------------------------------------
      # Raw build log on failure (or when IPA was not produced), so failures can be
      # diagnosed from the full unfiltered xcodebuild output without re-running.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: build/logs/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: SideStore.dSYMs.zip
